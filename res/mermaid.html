<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { background: white; }
  body.dark { background: #1e1e1e; }
  #container { display: block; }
</style>
<script>
  let currentTheme = null;
  let renderCount = 0;

  function mermaidReady() {
    return typeof mermaid !== 'undefined' && typeof mermaid.render === 'function';
  }

  function ensureThemeInitialized(isDark) {
    const wantTheme = isDark ? 'dark' : 'default';
    if (currentTheme !== wantTheme) {
      // htmlLabels:false は Mermaid v10+ のトップレベル設定で flowchart/class/state
      // のノードラベルを <foreignObject> ではなく SVG <text> として出力させる。
      // Office/Inkscape が <foreignObject> 内 HTML を描画しないため、SVG コピーを
      // 互換にするには表示用とエクスポート用で共通化する必要がある。
      mermaid.initialize({
        startOnLoad: false,
        theme: wantTheme,
        securityLevel: 'strict',
        htmlLabels: false,
      });
      currentTheme = wantTheme;
    }
  }

  async function renderMermaid(code, isDark, maxWidth) {
    try {
      if (!mermaidReady()) {
        return JSON.stringify({ ok: false, error: 'mermaid not loaded' });
      }
      document.body.className = isDark ? 'dark' : '';
      ensureThemeInitialized(isDark);
      const container = document.getElementById('container');
      container.innerHTML = '';
      document.body.style.width = '';
      container.style.maxWidth = '';
      renderCount++;
      const id = 'mmd-' + renderCount;
      const { svg } = await mermaid.render(id, code);
      container.innerHTML = svg;
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      const svgEl = container.querySelector('svg');
      if (svgEl) {
        const rect = svgEl.getBoundingClientRect();
        return JSON.stringify({
          width: Math.ceil(rect.width),
          height: Math.ceil(rect.height),
          dpr: window.devicePixelRatio || 1,
          ok: true
        });
      }
      return JSON.stringify({ ok: false, error: 'SVG not found' });
    } catch (e) {
      return JSON.stringify({ ok: false, error: e.message || String(e) });
    }
  }

  // 表示用 container を触らず SVG 文字列のみ返す。PNG キャプチャ無し。
  // ensureThemeInitialized で htmlLabels:false を設定済みなので、Mermaid 出力は
  // Office/Inkscape 互換 (foreignObject なし) の SVG になる。
  async function renderMermaidSvg(code, isDark) {
    try {
      if (!mermaidReady()) {
        return null;
      }
      ensureThemeInitialized(isDark);
      renderCount++;
      const { svg } = await mermaid.render('mmd-svg-' + renderCount, code);
      return svg;
    } catch (e) {
      return null;
    }
  }

  (async function() {
    try {
      const resp = await fetch('https://app.local/mermaid.min.js.gz');
      const ds = new DecompressionStream('gzip');
      const text = await new Response(resp.body.pipeThrough(ds)).text();
      const blob = new Blob([text], {type: 'application/javascript'});
      const url = URL.createObjectURL(blob);
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      URL.revokeObjectURL(url);
      var dpr = window.devicePixelRatio || 1;
      window.chrome.webview.postMessage(
        mermaidReady() ? ('mermaid-ready:' + dpr) : 'mermaid-failed');
    } catch(e) {
      window.chrome.webview.postMessage('mermaid-failed');
    }
  })();
</script>
</head>
<body>
<div id="container"></div>
</body>
</html>
