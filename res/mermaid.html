<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { background: white; }
  body.dark { background: #1e1e1e; }
  #container { display: block; }
  /* 数式のラベルの寸法を測る場所。画面には出さない。 */
  #measure { position: absolute; left: 0; top: 0; visibility: hidden; white-space: nowrap; }
  #measure math, .pele-math math { display: inline math; }
  /* クリップボード用の SVG に値を書き込む場所。visibility も書き込むので隠さず、画面の外に置く。 */
  #bake { position: absolute; left: -100000px; top: 0; }
</style>
<script>
  let renderCount = 0;

  function peleReady() {
    return typeof pele !== 'undefined' && typeof pele.render === 'function';
  }

  // 本文 (Theme::font_family と theme_palette::kMonospaceFontCandidates) と同じ書体で組む。Segoe UI に無い文字は、
  // 本文と同じくロケールで決まるフォントにする。ブラウザのフォールバックに任せると日本語の字幅が本文と変わる。
  const CJK_FONTS = { 'ja-jp': 'Yu Gothic UI', 'zh-cn': 'Microsoft YaHei UI', 'zh-tw': 'Microsoft JhengHei UI',
                      'zh-hk': 'Microsoft JhengHei UI', 'ko-kr': 'Malgun Gothic' };
  function fonts(locale) {
    const cjk = '"' + (CJK_FONTS[locale] || CJK_FONTS['ja-jp']) + '"';
    return { fontFamily: '"Segoe UI", ' + cjk, fontFamilyMono: '"Cascadia Mono", Consolas, "Courier New", ' + cjk };
  }

  // ダークテーマの配色。SVG のルートに書き込み、拡大表示のページにもそのまま渡す。ライトは pele の既定のまま。
  // 背景は body.dark と mermaid_viewer.html の背景にそろえる。
  // 系列の色は pele の既定に白を 25% 混ぜる。円グラフの割合などは系列の色の上に背景色で書かれ、既定のままだと
  // 青の上で 3.6:1 しかない (混ぜると全色 5.7:1 以上)。
  const DARK_VARS = '--pele-bg:#1e1e1e;--pele-fg:#e0e0e0;--pele-muted:#a0a0a0;--pele-line:#d0d0d0;' +
                    '--pele-surface:#2b2b2b;--pele-surface-alt:#363636;--pele-border:#7a7a7a;--pele-accent:#7c9be6;' +
                    '--pele-series-1:#799abe;--pele-series-2:#f8a452;--pele-series-3:#7fb978;--pele-series-4:#eb8180;' +
                    '--pele-series-5:#95c9c5;--pele-series-6:#f2d76c;--pele-series-7:#c59bb9;--pele-series-8:#b69886;';
  function themed(svg, isDark) {
    return isDark ? svg.replace(/^(<svg\b[^>]*?\sstyle=")/, '$1' + DARK_VARS) : svg;
  }

  // KaTeX は数式があるときだけ読む。UMD 版なので window.katex に入る。
  let katexPromise = null;
  function loadKatex() {
    // 失敗は覚えず、次に使うときに読み直す (一度失敗しただけで、このワーカーの数式が描けなくならないように)。
    katexPromise ??= new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://app.local/katex.js';
      s.onload = () => window.katex ? resolve(window.katex) : reject(new Error('KaTeX not loaded'));
      s.onerror = () => reject(new Error('KaTeX not loaded'));
      document.head.appendChild(s);
    }).catch(e => {
      katexPromise = null;
      throw e;
    });
    return katexPromise;
  }

  // 図のラベルの $$...$$。pele は寸法を同期で求めるので、ここで DOM に入れて測る。描けない数式は元の文字のまま出させる。
  function labelMath(tex, size) {
    let html;
    try {
      html = katex.renderToString(tex, { throwOnError: true, displayMode: false, output: 'mathml' });
    } catch (e) {
      return null;
    }
    const m = document.getElementById('measure');
    m.style.fontSize = size + 'px';
    m.innerHTML = html;
    const r = m.getBoundingClientRect();
    m.innerHTML = '';
    return { html: html, width: Math.ceil(r.width), height: Math.ceil(r.height) };
  }

  // withMath はラベルの数式を MathML で描く (<foreignObject> になる)。KaTeX はコードに $$ があるときだけ読む。
  async function renderPele(code, maxWidth, locale, withMath) {
    if (!peleReady()) {
      throw new Error('pele not loaded');
    }
    let math;
    if (withMath && code.includes('$$')) {
      try {
        await loadKatex();
        math = labelMath;
      } catch (e) {
      }
    }
    renderCount++;
    // links と images: mermaid の securityLevel 'strict' と同じく、図からの遷移と外部の画像を許さない。
    // autoDirection: 狭いときに LR を TB に替えさせず、書いた向きのまま縮める。
    return pele.render(code, Object.assign({
      maxWidth: maxWidth,
      autoDirection: false,
      links: false,
      images: false,
      idPrefix: 'p' + renderCount,
      math: math,
    }, fonts(locale))).svg;
  }

  // C++ の ParseRenderSize が読む "幅:高さ:devicePixelRatio"。CSS px で切り上げる。
  function sizeString(width, height) {
    return Math.ceil(width) + ':' + Math.ceil(height) + ':' + (window.devicePixelRatio || 1);
  }

  // getComputedStyle の色を [r, g, b, a] (r〜b は 0〜255 の整数) にする。color-mix() の結果は color(srgb ...) で返る。
  // none や url() は null。
  function parseColor(value) {
    let m = /^rgba?\(([^)]*)\)$/.exec(value);
    let scale = 1;
    if (!m) {
      m = /^color\(srgb ([^)]*)\)$/.exec(value);
      scale = 255;
    }
    if (!m) {
      return null;
    }
    const p = m[1].split(/[\s,/]+/).filter(Boolean).map(Number);
    if (p.length < 3 || !p.every(Number.isFinite)) {
      return null;
    }
    const channel = v => Math.min(255, Math.max(0, Math.round(v * scale)));
    return [channel(p[0]), channel(p[1]), channel(p[2]), p.length > 3 ? Math.min(1, Math.max(0, p[3])) : 1];
  }
  const hexColor = c => '#' + c.slice(0, 3).map(v => v.toString(16).padStart(2, '0')).join('');
  const num = v => String(+(+v).toFixed(3));
  const escapeAttr = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  // ---- 描画命令 (C++ の mermaid_util::ParseDrawing) ----
  // キャプチャ (1 図 60ms ほど待つ) の代わりに、ブラウザが解決した値を書き出し、C++ が Direct2D と DirectWrite で描く。
  // 図形は ID2D1SvgDocument が読める要素と属性だけの SVG にし、文字は 1 行ずつの並びにする (D2D の SVG は文字を描かない)。

  const BACKGROUND = { light: 0xffffff, dark: 0x1e1e1e }; // body の背景
  const SHAPE_SELECTOR = 'path,rect,circle,ellipse,line,polyline,polygon';
  // 書き出せない要素。含む図はキャプチャで描く (数式のラベルは <foreignObject> になる)。
  // 入れ子の <svg> (アイコン) は getScreenCTM がその座標系への変換を含み、アイコンは枠の中に収まるので書き出せる。
  const UNSUPPORTED_SELECTOR = 'foreignObject,image,use,pattern,mask,filter,clipPath,marker,textPath';

  // 要素の、root までの祖先を含めた不透明度を返す関数。どこかが display:none なら 0。
  // 親の値を覚えておき、要素ごとに祖先を辿り直さない。
  function opacityResolver(root) {
    const cache = new Map();
    const opacityOf = el => {
      let value = cache.get(el);
      if (value === undefined) {
        const cs = getComputedStyle(el);
        value = cs.display === 'none' ? 0 : +cs.opacity;
        if (value !== 0 && el !== root) {
          value *= opacityOf(el.parentElement);
        }
        cache.set(el, value);
      }
      return value;
    };
    return opacityOf;
  }

  // rx・ry の auto はもう片方の値になる。両方 auto なら null。
  function radii(cs) {
    const rx = cs.rx === 'auto' ? cs.ry : cs.rx;
    const ry = cs.ry === 'auto' ? cs.rx : cs.ry;
    return rx === 'auto' ? null : [parseFloat(rx), parseFloat(ry)];
  }

  // グラデーションの止まりの [#rrggbb, 不透明度]。alpha は塗りの不透明度で、掛け合わせる。
  function stopPaint(stop, alpha) {
    const cs = getComputedStyle(stop);
    const c = parseColor(cs.stopColor) || [0, 0, 0, 1];
    return [hexColor(c), c[3] * +cs.stopOpacity * alpha];
  }

  function overlaps(a, b) {
    return a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  }

  // SVG の文字の要素を、ブラウザが置いた位置の 1 行ずつの並びにする。書き出せなければ null。
  function textRuns(t, toRoot, opacityOf) {
    const nodes = [];
    const walker = document.createTreeWalker(t, NodeFilter.SHOW_TEXT);
    for (let node; (node = walker.nextNode());) {
      nodes.push(node);
    }
    // 空白を畳んだ文字は位置の番号が DOM の文字とずれる。pele は畳まないので、ずれたらキャプチャに回す。
    if (nodes.reduce((n, node) => n + node.data.length, 0) !== t.getNumberOfChars()) {
      return null;
    }
    const m = toRoot(t);
    const matrix = [m.a, m.b, m.c, m.d, m.e, m.f].map(num).join(',');
    const runs = [];
    let index = 0;
    for (const node of nodes) {
      const start = index;
      index += node.data.length;
      const owner = node.parentElement;
      const cs = getComputedStyle(owner);
      const opacity = opacityOf(owner);
      const color = parseColor(cs.fill);
      if (!node.data.trim() || cs.visibility !== 'visible' || opacity === 0 || !color) {
        continue;
      }
      const sp = t.getStartPositionOfChar(start);
      const ep = t.getEndPositionOfChar(index - 1);
      // 右から左へ並ぶ文字や 1 行に並ばない文字は、DirectWrite で同じ位置に置けない。
      if (ep.x < sp.x || Math.abs(ep.y - sp.y) > 0.5) {
        return null;
      }
      let underline = false;
      for (let e = owner; e && !underline; e = e === t ? null : e.parentElement) {
        underline = /underline/.test(getComputedStyle(e).textDecorationLine);
      }
      const rgb = (color[0] << 16) | (color[1] << 8) | color[2];
      const numbers = [matrix, num(sp.x), num(sp.y), num(parseFloat(cs.fontSize)), parseInt(cs.fontWeight, 10) || 400,
                       /italic|oblique/.test(cs.fontStyle) ? 1 : 0, underline ? 1 : 0, rgb,
                       num(color[3] * +cs.fillOpacity * opacity)].join(',');
      const family = cs.fontFamily;
      const text = node.data.replace(/[\r\n\t]/g, ' ');
      runs.push({ rect: owner.getBoundingClientRect(),
                  markup: numbers + ':' + family.length + ':' + family + text.length + ':' + text });
    }
    return runs;
  }

  // 図形 1 つを、色・不透明度・変換を属性に確定させた要素にする。
  function shapeMarkup(el, cs, matrix, opacity, gradientRef) {
    // D2D の SVG はグラデーションで塗るときの fill-opacity / stroke-opacity を無視するので、止まりの不透明度に掛ける。
    const paint = (value, opacityValue) => {
      const url = /^url\("?#([^")]+)"?\)/.exec(value);
      if (url) {
        const name = gradientRef(url[1], +opacityValue);
        return name ? ['url(#' + name + ')', 1] : null;
      }
      const c = parseColor(value);
      return c ? [hexColor(c), c[3] * +opacityValue] : null;
    };
    const fill = paint(cs.fill, cs.fillOpacity);
    const stroke = paint(cs.stroke, cs.strokeOpacity);
    let a = 'transform="matrix(' + [matrix.a, matrix.b, matrix.c, matrix.d, matrix.e, matrix.f].map(num).join(' ') + ')"';
    a += fill ? ' fill="' + fill[0] + '" fill-opacity="' + num(fill[1]) + '"' : ' fill="none"';
    if (cs.fillRule === 'evenodd') {
      a += ' fill-rule="evenodd"';
    }
    if (stroke) {
      a += ' stroke="' + stroke[0] + '" stroke-opacity="' + num(stroke[1]) + '" stroke-width="' + num(parseFloat(cs.strokeWidth)) + '"' +
           ' stroke-linecap="' + cs.strokeLinecap + '" stroke-linejoin="' + cs.strokeLinejoin + '" stroke-miterlimit="' + num(cs.strokeMiterlimit) + '"';
      if (cs.strokeDasharray !== 'none') {
        a += ' stroke-dasharray="' + cs.strokeDasharray.replace(/px/g, '') + '" stroke-dashoffset="' + num(parseFloat(cs.strokeDashoffset)) + '"';
      }
    }
    if (opacity < 1) {
      a += ' opacity="' + num(opacity) + '"';
    }
    const tag = el.tagName;
    const px = name => num(parseFloat(cs.getPropertyValue(name)));
    let g;
    if (tag === 'path') {
      g = 'd="' + escapeAttr(el.getAttribute('d') || '') + '"';
    }
    else if (tag === 'rect') {
      g = 'x="' + px('x') + '" y="' + px('y') + '" width="' + px('width') + '" height="' + px('height') + '"';
      const r = radii(cs);
      if (r) {
        g += ' rx="' + num(r[0]) + '" ry="' + num(r[1]) + '"';
      }
    }
    else if (tag === 'circle') {
      g = 'cx="' + px('cx') + '" cy="' + px('cy') + '" r="' + px('r') + '"';
    }
    else if (tag === 'ellipse') {
      const r = radii(cs) || [0, 0];
      g = 'cx="' + px('cx') + '" cy="' + px('cy') + '" rx="' + num(r[0]) + '" ry="' + num(r[1]) + '"';
    }
    else if (tag === 'line') {
      g = ['x1', 'y1', 'x2', 'y2'].map(k => k + '="' + escapeAttr(el.getAttribute(k) || '0') + '"').join(' ');
    }
    else {
      g = 'points="' + escapeAttr(el.getAttribute('points') || '') + '"';
    }
    return '<' + tag + ' ' + a + ' ' + g + '/>';
  }

  // グラデーションを、止まりの色を確定させて書き出す。alpha は塗りの不透明度で、止まりの不透明度に掛ける。
  function gradientMarkup(g, name, alpha) {
    let a = 'id="' + name + '"';
    for (const k of ['gradientUnits', 'gradientTransform', 'spreadMethod', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'fx', 'fy']) {
      if (g.hasAttribute(k)) {
        a += ' ' + k + '="' + escapeAttr(g.getAttribute(k)) + '"';
      }
    }
    let stops = '';
    for (const s of g.querySelectorAll('stop')) {
      const [color, opacity] = stopPaint(s, alpha);
      stops += '<stop offset="' + escapeAttr(s.getAttribute('offset') || '0') + '" stop-color="' + color + '" stop-opacity="' + num(opacity) + '"/>';
    }
    return '<' + g.tagName + ' ' + a + '>' + stops + '</' + g.tagName + '>';
  }

  // 書き出せない図は null (キャプチャで描く)。
  function drawingOf(svg, isDark) {
    if (svg.querySelector(UNSUPPORTED_SELECTOR)) {
      return null;
    }
    const box = svg.getBoundingClientRect();
    const width = Math.ceil(box.width);
    const height = Math.ceil(box.height);
    // 図の左上を原点とする CSS px への変換。
    const origin = new DOMMatrix([1, 0, 0, 1, -box.left, -box.top]);
    const toRoot = el => origin.multiply(el.getScreenCTM());
    const opacityOf = opacityResolver(svg);
    let defs = '';
    const gradients = new Map();
    const gradientRef = (id, alpha) => {
      const key = id + '|' + num(alpha);
      if (!gradients.has(key)) {
        const g = svg.getElementById(id);
        const ok = g && (g.tagName === 'linearGradient' || g.tagName === 'radialGradient');
        gradients.set(key, ok ? 'g' + gradients.size : null);
        if (ok) {
          defs += gradientMarkup(g, gradients.get(key), alpha);
        }
      }
      return gradients.get(key);
    };
    // 図形は今の層の文字に重なるときだけ次の層へ送り、文書の順の重なりを保つ。
    const layers = [{ shapes: '', texts: [] }];
    for (const el of svg.querySelectorAll(SHAPE_SELECTOR + ',text')) {
      if (el.closest('defs')) {
        continue;
      }
      const opacity = opacityOf(el);
      if (opacity === 0) {
        continue;
      }
      if (el.tagName === 'text') {
        const runs = textRuns(el, toRoot, opacityOf);
        if (runs === null) {
          return null;
        }
        layers[layers.length - 1].texts.push(...runs);
        continue;
      }
      const cs = getComputedStyle(el);
      if (cs.visibility !== 'visible') {
        continue;
      }
      const r = el.getBoundingClientRect();
      const pad = parseFloat(cs.strokeWidth) || 0;
      const bounds = { left: r.left - pad, top: r.top - pad, right: r.right + pad, bottom: r.bottom + pad };
      if (layers[layers.length - 1].texts.some(t => overlaps(bounds, t.rect))) {
        layers.push({ shapes: '', texts: [] });
      }
      layers[layers.length - 1].shapes += shapeMarkup(el, cs, toRoot(el), opacity, gradientRef);
    }
    const head = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">' +
                 (defs ? '<defs>' + defs + '</defs>' : '');
    let out = [width, height, window.devicePixelRatio || 1, isDark ? BACKGROUND.dark : BACKGROUND.light, layers.length].join(':') + ':';
    for (const layer of layers) {
      const shapes = layer.shapes ? head + layer.shapes + '</svg>' : '';
      // 最後の 0 は数式のラベルの数。数式のラベルは C++ が KaTeX で描くので、ページの描画命令には無い。
      out += shapes.length + ':' + shapes + layer.texts.length + ':' + layer.texts.map(t => t.markup).join('') + '0:';
    }
    return out;
  }

  // 描けなければ投げる。呼び出し側 (message の受け口) の catch が render-error でメッセージを返す。
  // 戻り値は [結果の種類, 中身]。書き出せれば draw-result と描画命令、書き出せない図は render-result と sizeString
  // (C++ がキャプチャする)。
  async function renderDiagram(code, isDark, maxWidth, locale) {
    const svg = await renderPele(code, maxWidth, locale, true);
    document.body.className = isDark ? 'dark' : '';
    const container = document.getElementById('container');
    // max-width:100% で縮める基準。ビューの大きさは要求より遅れて届くので、それには頼らない。
    container.style.width = maxWidth + 'px';
    container.lang = locale;
    container.innerHTML = themed(svg, isDark);
    // getBoundingClientRect が同期レイアウトを強制するので描画フレームを待つ必要はない
    const svgEl = container.querySelector('svg');
    if (!svgEl) {
      throw new Error('SVG not found');
    }
    let drawing = null;
    try {
      drawing = drawingOf(svgEl, isDark);
    } catch (e) {
    }
    if (drawing !== null) {
      return ['draw-result', drawing];
    }
    const rect = svgEl.getBoundingClientRect();
    return ['render-result', sizeString(rect.width, rect.height)];
  }

  // クリップボード用。Office や Inkscape は CSS 変数と color-mix() を読めないので、ブラウザが解決した値を
  // 属性に書き込み、style と class を外す。
  // opacity・display・visibility は継承しないので、<g> に style で付いたものも要素ごとに書き込む。
  // fill-opacity・stroke-opacity は色の不透明度と掛け合わせて fill・stroke と一緒に書く。
  const PAINT_PROPS = ['fill', 'fill-rule', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-dashoffset', 'stroke-linecap',
                       'stroke-linejoin', 'stroke-miterlimit', 'opacity', 'display', 'visibility'];
  const TEXT_PROPS = ['font-family', 'font-size', 'font-weight', 'font-style', 'text-decoration-line'];
  // rgb()/rgba() と color(srgb ...) は SVG 1.1 の読み手が読めないことがあるので #rrggbb と不透明度に分ける。
  function splitColor(value) {
    const c = parseColor(value);
    return c ? [hexColor(c), c[3]] : [value, 1];
  }
  function bakeElement(el) {
    const cs = getComputedStyle(el);
    const props = el instanceof SVGTextContentElement ? PAINT_PROPS.concat(TEXT_PROPS) : PAINT_PROPS;
    for (const prop of props) {
      const value = cs.getPropertyValue(prop);
      if (prop === 'fill' || prop === 'stroke') {
        const [color, alpha] = splitColor(value);
        el.setAttribute(prop, color);
        el.setAttribute(prop + '-opacity', String(alpha * +cs.getPropertyValue(prop + '-opacity')));
      }
      else if (prop === 'text-decoration-line') {
        if (value !== 'none') {
          el.setAttribute('text-decoration', value);
        }
      }
      else {
        el.setAttribute(prop, value);
      }
    }
    const r = el instanceof SVGRectElement ? radii(cs) : null;
    if (r) {
      el.setAttribute('rx', r[0]);
      el.setAttribute('ry', r[1]);
    }
  }
  function bakeSvg(svgText, isDark, locale) {
    const host = document.getElementById('bake');
    host.lang = locale;
    host.innerHTML = themed(svgText, isDark);
    try {
      const svg = host.querySelector('svg');
      if (!svg) {
        throw new Error('SVG not found');
      }
      const elements = [svg, ...svg.querySelectorAll('*')];
      for (const el of elements) {
        if (el instanceof SVGGraphicsElement) {
          bakeElement(el);
        }
        else if (el instanceof SVGStopElement) {
          const [color, opacity] = stopPaint(el, 1);
          el.setAttribute('stop-color', color);
          el.setAttribute('stop-opacity', String(opacity));
        }
      }
      // <g> などに残る var() は、子に解決済みの値を書いたので継承させなくてよい。
      for (const el of elements) {
        el.removeAttribute('style');
        el.removeAttribute('class');
        for (const a of [...el.attributes]) {
          if (a.value.includes('var(') || a.value.includes('color-mix(')) {
            el.removeAttribute(a.name);
          }
        }
      }
      return new XMLSerializer().serializeToString(svg);
    } finally {
      host.innerHTML = '';
    }
  }

  // kind は 'svg' (クリップボード) か 'view' (拡大表示)。表示用 container を触らず SVG 文字列のみ返す。PNG キャプチャ無し。
  // 拡大表示は本文と同じ見た目にするので、数式のラベルも描き、色は CSS 変数のまま渡す。
  async function renderSvg(kind, code, isDark, maxWidth, locale) {
    if (kind === 'view') {
      return themed(await renderPele(code, maxWidth, locale, true), isDark);
    }
    return bakeSvg(await renderPele(code, maxWidth, locale, false), isDark, locale);
  }

  function errorText(e) {
    return (e && e.message) || String(e);
  }

  // C++ (mermaid_util::Page*Message) からの要求。"<種類>:<要求 ID>:..." の形で、図のコードは末尾に置く。
  // 結果は "<結果の種類>:<要求 ID>:<中身>" で、描けなければ "render-error:<要求 ID>:<文言>" で返す。
  function readField(msg, pos) {
    const end = msg.indexOf(':', pos);
    return [msg.slice(pos, end), end + 1];
  }
  window.chrome.webview.addEventListener('message', function(e) {
    const msg = e.data;
    let [kind, pos] = readField(msg, 0);
    let id;
    [id, pos] = readField(msg, pos);
    if (kind === 'capture') {
      // 新しい大きさのフレームを描き始めてから知らせる (Promise-await の問題を回避)。rAF 2 回待っていたが、1 回でも
      // 写した PNG は同じで (図・ブロック数式・まとめ描き 20 枚 x 3 巡)、1 回のキャプチャの中央値が図とブロック数式で
      // 65.7 → 56.0ms、まとめ描きで 63.6 → 39.1ms。待たずに頼んでも CapturePreview が次のフレームを待つので縮まない (63.2ms)。
      requestAnimationFrame(() => window.chrome.webview.postMessage('capture-ready:' + id));
      return;
    }
    // task は [結果の種類, 中身] を返す。
    let task;
    let dark, width, locale;
    [dark, pos] = readField(msg, pos);
    [width, pos] = readField(msg, pos);
    [locale, pos] = readField(msg, pos);
    const code = msg.slice(pos);
    const isDark = dark === '1';
    if (kind === 'svg' || kind === 'view') {
      task = renderSvg(kind, code, isDark, +width, locale).then(r => ['svg-result', r]);
    }
    else {
      task = renderDiagram(code, isDark, +width, locale);
    }
    task.then(([result, body]) => result + ':' + id + ':' + body, err => 'render-error:' + id + ':' + errorText(err))
        .then(reply => window.chrome.webview.postMessage(reply));
  });

  (async function() {
    try {
      window.pele = await import('https://app.local/pele.mjs');
      var dpr = window.devicePixelRatio || 1;
      window.chrome.webview.postMessage(
        peleReady() ? ('mermaid-ready:' + dpr) : 'mermaid-failed');
    } catch(e) {
      window.chrome.webview.postMessage('mermaid-failed');
    }
  })();
</script>
</head>
<body>
<div id="container"></div>
<div id="measure"></div>
<div id="bake"></div>
</body>
</html>
