<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 背景は mermaid.html の図の背景と、mermaid.cpp の ViewerBackground にそろえる。 */
  :root { color-scheme: light; --bg: #ffffff; --fg: #333333; --bar: rgba(240, 240, 240, 0.94); --hover: rgba(0, 0, 0, 0.1); }
  :root.dark { color-scheme: dark; --bg: #1e1e1e; --fg: #dddddd; --bar: rgba(50, 50, 50, 0.94); --hover: rgba(255, 255, 255, 0.15); }
  html, body { margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 13px "Segoe UI", system-ui, sans-serif; user-select: none; }
  #stage { position: absolute; inset: 0; overflow: auto; outline: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  /* 図が窓より小さいときは中央に置き、大きいときは左上からスクロールできるようにする (place-items の中央寄せだと上と左が切れる)。 */
  #host { display: flex; width: max-content; height: max-content; min-width: 100%; min-height: 100%; box-sizing: border-box; padding: 16px; }
  #host svg { flex: none; margin: auto; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #bar { position: fixed; top: 12px; right: 28px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 6px; background: var(--bar); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
  #bar[hidden], #loading[hidden] { display: none; }
  #bar button { width: 30px; height: 28px; padding: 0; border: 0; border-radius: 4px; background: none; color: inherit; font: inherit; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  #bar button:hover:enabled { background: var(--hover); }
  #bar button:disabled { opacity: 0.35; }
  #zoom { min-width: 48px; text-align: center; }
</style>
</head>
<body>
<div id="stage" tabindex="-1"><div id="host"></div></div>
<div id="loading"></div>
<div id="bar" hidden>
  <button id="out">&#x2212;</button>
  <span id="zoom"></span>
  <button id="in">+</button>
  <button id="fit"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/></svg></button>
</div>
<script src="viewer.js"></script>
</body>
</html>
